<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Word Streak: a 5-question daily English quiz. Keep your streak, earn points and badges.">
  <title>Word Streak</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">W</span> Word Streak</div>
    <div class="topbar-stats" id="topStats" aria-live="polite"></div>
  </header>
  <main id="app" class="wrap" tabindex="-1">
    <noscript>Word Streak needs JavaScript to run.</noscript>
  </main>
  <footer class="footer">Practice English a little every day. Works offline after the first visit.</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
